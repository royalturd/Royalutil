# Royalutil install catalog
#
# Lets you add/remove installable Flatpak apps and CLI utilities without
# touching royalutil.sh or royalutil_gui.py — both read this file.
#
# Format:
#   [flatpak]  -> id|Display Name|Description   (id = Flatpak application ID)
#   [utilities] -> id|Display Name|Description  (id = apt/brew package & command name)
#
# Lines starting with # and blank lines are ignored. If this file is
# missing, or a section is empty, Royalutil falls back to its small
# built-in default list for that section.
#
# Override the path Royalutil looks for with: ROYALUTIL_CONFIG=/path/to/file

